name: GitHub-Profile-Summary-Cards

on:
  schedule: # generate every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 8
          AUTO_PUSH: false
          THEME: "default"
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=#f97316&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39&color_background=#ffffff
            dist/github-contribution-grid-snake-dark.gif?color_snake=#f97316&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353&color_background=#0d1117
      - name: Download tech stack and activity images
        run: |
          mkdir -p assets

          # Some card services return an error message inside an SVG with HTTP 200.
          # Validate downloads before replacing the last known-good asset.
          fetch_svg() {
            out="$1"
            url="$2"
            tmp="${out}.tmp"

            for attempt in 1 2 3; do
              rm -f "$tmp"
              if curl -sL --fail --max-time 90 \
                  --retry 2 --retry-all-errors --retry-delay 2 \
                  -H 'Accept: image/svg+xml' "$url" -o "$tmp" \
                && grep -q '<svg' "$tmp" \
                && ! grep -Eqi 'Failed to retrieve contributions|GitHub API issue|Something went wrong|Internal Server Error|Application error' "$tmp"; then
                mv "$tmp" "$out"
                echo "asset ok: $out"
                return 0
              fi

              echo "asset validation failed: $out (attempt $attempt/3)"
              rm -f "$tmp"
            done

            if [ -s "$out" ]; then
              echo "::warning file=$out::Keeping the last known-good asset because the upstream response was invalid."
              return 0
            fi

            echo "::error file=$out::No valid asset is available."
            return 1
          }

          fetch_svg assets/tech-stack.svg \
            'https://skillicons.dev/icons?i=rust,ts,js,vue,vite,docker,git,github,linux,bash'
          fetch_svg assets/streak-light.svg \
            'https://streak-stats.demolab.com?user=Karl-Dai&theme=default&hide_border=true&border_radius=12'
          fetch_svg assets/streak-dark.svg \
            'https://streak-stats.demolab.com?user=Karl-Dai&theme=tokyonight&hide_border=true&border_radius=12'
          fetch_svg assets/activity-graph-light.svg \
            'https://github-readme-activity-graph.vercel.app/graph?username=Karl-Dai&theme=github-light&hide_border=true&radius=12&area=true'
          fetch_svg assets/activity-graph-dark.svg \
            'https://github-readme-activity-graph.vercel.app/graph?username=Karl-Dai&theme=tokyo-night&hide_border=true&radius=12&area=true'
          # Trophies: official instance is rate-limited/paused, try mirrors in order (non-fatal)
          fetch_trophy() {
            out="$1"; theme="$2"
            for base in \
              'https://github-profile-trophy.vercel.app' \
              'https://trophy.ryglcloud.net' \
              'https://trophygithubreadmelang.cybee.dpdns.org' \
              'https://github-profile-trophy-liard-delta.vercel.app' \
              'https://github-profile-trophy-winning.vercel.app' \
              'https://github-profile-trophy-kannan.vercel.app' \
              'https://github-profile-trophy-tawny.vercel.app'; do
              if curl -sL --fail --max-time 60 -H 'Accept: image/svg+xml' "$base/?username=Karl-Dai&theme=$theme&column=7&margin-w=10&margin-h=10&no-frame=true" -o "$out" && grep -q '<svg' "$out"; then
                echo "trophy ok: $base ($theme)"; return 0
              fi
            done
            echo "trophy FAILED: all mirrors down ($theme)"; return 1
          }
          fetch_trophy assets/trophy-light.svg flat || true
          fetch_trophy assets/trophy-dark.svg onedark || true
          ls -la assets
      - uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update profile cards, snake and activity images"
          add: "."
